<!DOCTYPE html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link href="favicon.ico" rel="icon">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="扫码登录获取BDUSS">
  <meta name="keywords" content="百度,登录,百度登录,BDUSS,BDUSS在线获取">
  <title>扫码登录获取BDUSS</title>
  <style>
    .block {
      display: block;
    }

    .none {
      display: none;
    }

    .flex {
      display: flex;
      justify-content: center;
    }

    .callback-link {
      margin-top: 0.5em;
      display: flex;
      justify-content: center;
    }

    a {
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media screen and (min-width: 0) {
      .container {
        padding-left: 5%;
        padding-right: 5%;
      }
    }

    @media screen and (min-width: 576px) {
      .container {
        padding-left: 20vw;
        padding-right: 20vw;
      }
    }

    .standard-max-width {
      max-width: 200px;
    }
  </style>
  <style>
    /* 
      mock @geist-ui 
    */
    .zi-btn {
      border-radius: 5px;
      border: 1px solid #666666;
      padding: 0.5em 0;
      background-color: #f8f8f8;
      width: 100%;
      max-width: 200px;
      font-size: 1em;
      color: #666666;
      cursor: pointer;
      transition: all;
      transition-duration: 150ms;
    }

    .zi-btn:hover {
      color: white;
      background-color: black;
    }

    .success {
      color: white;
      border-color: #0070f3;
      background-color: #0070f3;
    }

    .success:hover {
      color: #0070f3;
      background-color: #f8f8f8;
    }

    .primary {
      color: white;
      border: 1px solid black;
      background-color: black;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }

    .zi-card {
      border-radius: 5px;
      border: 1px solid #666666;
      padding: 1rem;
    }

    ul {
      padding-left: 1em;
    }

    li {
      margin-bottom: 0.5rem;
    }

    .zi-note {
      border-radius: 5px;
      border: 2px solid #f5a623;
      padding: 1rem
    }

    .zi-note-type {
      color: #f5a623;
      font-weight: 700;
    }

    .py-\[5vh\] {
      padding-block: 5vh;
    }

    .sm\:py-\[10vh\] {
      @media (width >=40rem

        /* 640px */
      ) {
        padding-block: 10vh;
      }
    }

    .lg\:py-\[18vh\] {
      @media (width >=64rem) {
        padding-block: 18vh;
      }
    }

    .px-\[5vw\] {
      padding-inline: 5vw;
    }

    .sm\:px-\[10vw\] {
      @media (width >=40rem

        /* 640px */
      ) {
        padding-inline: 10vw;
      }
    }

    .lg\:px-\[20vw\] {
      @media (width >=64rem

        /* 1024px */
      ) {
        padding-inline: 20vw;
      }
    }

    .longlong-content {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>

<body style="background-color: #f8f8f8;">
  <div id="app" class="container px-[5vw] sm:px-[10vw] lg:px-[20vw] py-[5vh] sm:py-[10vh] lg:py-[18vh]">
    <div id="app-alert" class="none">
      <p style="font-size: 1.1em; width: 100%; max-width: 200px;" class="longlong-content">
        <span style="user-select: none; margin-right: 0.25rem;">&gt;</span><span id="app-alert-link" href="."
          target="_blank" style="color: #0070f3; cursor: pointer;" onclick="alert(this.href)">localhost</span>
      </p>
    </div>

    <div id="card" class="zi-card pin" style="text-align: center; border: none;">
      <div id="card-callback-check" class="none" style="text-align: center;">
        <div style="display:flex; justify-content:center; align-items: center; width: 100%;">
          <ul style="margin-top:0; max-width: 200px; text-align: start;">
            <li>即将跳转至第三方应用</li>
            <li><span style="font-family:monospace;">/get-bduss</span> 不控制该应用</li>
            <li>继续操作将会发送Cookie</li>
            <li>请确认您<span style="text-decoration: underline; text-underline-offset: 2px;">信任</span>该应用</li>
            <li>否则请<span style="text-decoration: underline; text-underline-offset: 2px;">立即关闭</span>本页面</li>
          </ul>
        </div>
        <button onclick="firstCallbackCheck()" style="max-width: 200px;" class="zi-btn success"
          id="card-callback-check">继续</button>
      </div>

      <div id="card-loading" style="text-align: center;">
        <div style="display:flex; justify-content:center; align-items: center; width: 100%;">
          <div class="zi-card"
            style="max-width: calc(200px - 2rem); max-height: calc(200px - 2rem); display:flex; justify-content:center; align-items: center; width: 100%; aspect-ratio: 1; background-color: #ffffff;">
            <svg style="height: 2.5rem; width: 2.5rem; color: #0070f3;" class="animate-spin"
              xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path style="opacity: 0.75;" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
          </div>
        </div>
      </div>

      <div id="card-success" class="none">
        <div style="display:flex; justify-content:center; align-items: center; width: 100%;">
          <div class="zi-card"
            style="max-width: calc(200px - 2rem); max-height: calc(200px - 2rem); display:flex; justify-content:center; align-items: center; width: 100%; aspect-ratio: 1; background-color: #ffffff;">
            <svg alt="qrcode-success" style="color: #3C76FF;" xmlns="http://www.w3.org/2000/svg" width="2.5rem"
              height="2.5rem"
              viewBox="0 0 16 16"><!-- Icon from Bootstrap Icons by The Bootstrap Authors - https://github.com/twbs/icons/blob/main/LICENSE.md -->
              <path fill="currentColor"
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417L5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
            </svg>
          </div>
        </div>
        <h3>请确认登录</h3>
      </div>

      <div id="card-scan" class="none">
        <div style="display:flex; justify-content:center; width: 100%;">
          <div class="zi-card"
            style="max-width: calc(200px - 2rem); max-height: calc(200px - 2rem); background-color: #ffffff;">
            <img id="card-scan-img" alt="QRcode" style="width: 100%; aspect-ratio: 1;" onload="loadedQRCode()"
              onerror="switchActiveStatus('card-bduss-error')">
          </div>
        </div>
        <div style="margin-top: 1em; display:flex; justify-content:center; ">
          <button class="zi-btn" style="max-width: 200px;" onclick="switchMode()" id="more-button">更多</button>
        </div>

        <div style="margin-top: 0.5em; display:flex; justify-content:center;">
          <a id="web-check-button-pc" href="https://wappass.baidu.com/wp/?qrlogin=&amp;sign=" target="_blank"
            class="block" style="max-width: 200px; width: 100%;">
            <button class="zi-btn success" style="width: 100%;">网页授权</button>
          </a>
          <button id="web-check-button-mobile" onclick="openAuthPage()"
            class="zi-btn success none standard-max-width">网页授权</button>
        </div>
      </div>
      <div id="card-bduss-success-eta" class="none">
        <div style="display:flex; justify-content:center; align-items: center; width: 100%;">
          <div class="zi-card"
            style="max-width: calc(200px - 2rem); max-height: calc(200px - 2rem); display:flex; justify-content:center; align-items: center; width: 100%; aspect-ratio: 1; background-color: #ffffff;">
            <h1>5</h1>
          </div>
        </div>
        <h3>即将跳转...</h3>
      </div>
      <div id="card-bduss-success" class="none">
        <h3>Cookie 信息</h3>
        <div style="margin-top: 1em; width: 100%;" class="flex">
          <p class="zi-card pin" style="user-select: all; text-align: start; word-break: break-all; max-width: 500px;"
            id="bduss-list">
          </p>
        </div>
        <div id="card-bduss-success-inject" class="flex"></div>
        <div style="margin-top: 1em;">
          <button class="zi-btn primary" onclick="init(true)">再次获取</button>
        </div>
      </div>

      <div id="card-bduss-error" class="none">
        <div style="display:flex; justify-content:center; align-items: center; width: 100%;">
          <div class="zi-card"
            style="max-width: calc(200px - 2rem); max-height: calc(200px - 2rem); display:flex; justify-content:center; align-items: center; width: 100%; aspect-ratio: 1; background-color: #ffffff;">
            <svg alt="qrcode-failed" style="color: #ff3333;" xmlns="http://www.w3.org/2000/svg" width="2.5rem"
              height="2.5rem"
              viewBox="0 0 16 16"><!-- Icon from Bootstrap Icons by The Bootstrap Authors - https://github.com/twbs/icons/blob/main/LICENSE.md -->
              <path fill="currentColor"
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8 4a.905.905 0 0 0-.9.995l.35 3.507a.552.552 0 0 0 1.1 0l.35-3.507A.905.905 0 0 0 8 4m.002 6a1 1 0 1 0 0 2a1 1 0 0 0 0-2" />
            </svg>
          </div>
        </div>
        <h3>二维码无效</h3>
        <div style="margin-top: 1em;">
          <button class="zi-btn primary" onclick="init(true)">再次获取</button>
        </div>
      </div>
    </div>
    <div style="text-align: center; margin-top: 1em; font-family: monospace; color: #000000;"><a
        href="https://github.com/BANKA2017/get-bduss" target="_blank">/get-bduss</a></div>
  </div>
  <script>
    'use strict';

    // !!! DEPLOY YOUR OWN API ENDPOINT !!! vvv
    const api = "/api"
    // !!! DEPLOY YOUR OWN API ENDPOINT !!! ^^^

    const defaultResetCount = 15 //baidu is 18

    let activeId = "card-loading"//active id
    let fullModeStatus = false
    let callbackURL = {}
    let callbackStoken = null
    let hashCallback = false
    let authPage = null
    let nextInitAllow = 0
    const nextInitAllowDuration = 1000 * 30// 30s

    // from https://wappass.baidu.com/wp/?qrlogin=&sign=
    const isAndroid = window.navigator.appVersion.match(/android/gi)
    const isHarmony = /(OpenHarmony|HarmonyOS)/i.test(window.navigator.userAgent)
    const isIOS = /(iPhone|iPad|iPod|iOS)/i.test(navigator.userAgent)

    const isMobile = isAndroid || isHarmony || isIOS

    const getElement = (id) => {
      return document.getElementById(id)
    }

    const hideBlock = (id) => {
      getElement(id).classList.remove("block")
      getElement(id).classList.add("none")
    }

    const activeBlock = (id) => {
      getElement(id).classList.add("block")
      getElement(id).classList.remove("none")
    }

    const switchActiveStatus = (id) => {
      hideBlock(activeId)
      activeBlock(id)
      activeId = id
    }

    let controller = {
      qrcode: new AbortController(),
      bduss: [new AbortController()],
    }
    let resetCount = 0

    let sign = ''

    const init = (force = false) => {
      if (!force && nextInitAllow > 0 && Date.now() < nextInitAllow) {
        switchActiveStatus("card-bduss-error")
        return
      }
      nextInitAllow = Date.now() + nextInitAllowDuration

      switchActiveStatus("card-loading")
      getElement("card-bduss-success-inject").innerHTML = ''
      controller.qrcode.abort()
      controller.qrcode = new AbortController()
      //get qrcode
      fetch(api + '?m=getqrcode', {
        signal: controller.qrcode.signal
      }).then(async response => {
        response = await response.json()
        if (response?.errno !== 0) {
          switchActiveStatus("card-bduss-error")
          return
        }
        sign = response.data.sign
        getElement("card-scan-img").src = "//" + response.data.imgurl
        if (isMobile) {
          hideBlock("web-check-button-pc")
          activeBlock("web-check-button-mobile")
        } else {
          hideBlock("web-check-button-mobile")
          activeBlock("web-check-button-pc")
          getElement("web-check-button-pc").href = "https://wappass.baidu.com/wp/?qrlogin=&sign=" + sign
        }

      }).catch(() => switchActiveStatus("card-bduss-error"))
    }

    const loadedQRCode = () => {
      switchActiveStatus("card-scan")
      getStatus(1, sign)
    }

    const openAuthPage = () => {
      authPage = window.open('https://wappass.baidu.com/wp/?qrlogin&t=' + Math.ceil(Date.now() / 1000) + '&error=0&sign=' + sign + '&cmd=login&lp=pc&adapter=3', 'get-bduss:auth', 'width=' + window.innerWidth + ',height=' + window.innerHeight);
    }

    const closeAuthPage = () => {
      if (authPage) {
        authPage.close()
        authPage = null
      }
    }

    const getStatus = (status, sign) => {
      //-1 更换二维码
      //0 进入下一步
      //1 无需操作
      //2 已确认
      if (status > 1 || status < -1) {
        return
      }
      controller.bduss[controller.bduss.length - 1].abort()
      controller.bduss.push(new AbortController())

      if (resetCount > defaultResetCount) {
        init()
        resetCount = 1
        return
      } else {
        resetCount++
      }

      //get status
      fetch(api + '?' + (new URLSearchParams('m=getbduss&sign=' + sign + (fullModeStatus ? "&full=1" : "")).toString()), {
        signal: controller.bduss[controller.bduss.length - 1].signal
      }).then(async response => {
        response = await response.json()
        if (response?.errno !== 0) {
          switchActiveStatus("card-bduss-error")
          return
        }
        if (response.data.status >= 0 && response.data.status < 2) {
          if (response.data.state === 'scanned') {
            switchActiveStatus("card-success")
          } else if (response.data.state === 'waiting') {
            switchActiveStatus("card-scan")
          }
          getStatus(response.data.status, sign)
        } else if (response.data.state === 'error') {
          sign = ''
          switchActiveStatus("card-bduss-error")
        } else if (response.data.state === 'success') {
          getElement("bduss-list").innerText = response.data.bduss
          if (callbackURL?.href) {
            switchActiveStatus("card-bduss-success-eta")
            callbackURL.searchParams.append('bduss', response.data.bduss)
            if (fullModeStatus && response.data.data.stokenList[callbackStoken]) {
              callbackURL.searchParams.append('stoken', response.data.data.stokenList[callbackStoken])
            }

            eta((new Date()).getTime() + 5000, callbackURL.href.replace(callbackURL.hash, '').replace(callbackURL.search, '') + (hashCallback ? '#/' : '?') + callbackURL.searchParams.toString())
          } else {
            if (fullModeStatus && response.data.data) {
              //full mode
              let htmlTemplate = `<ul style="text-align: start; max-width: 500px;">`
              for (const key in response.data.data) {
                if (key === "stokenList") {
                  for (const stokenKey in response.data.data["stokenList"]) {
                    htmlTemplate += `<li><span style="font-size: 1.1rem; font-weight: 600">stoken.${escapeHTML(stokenKey)}</span>: <span style="user-select: all; word-break: break-all;">${escapeHTML(response.data.data.stokenList[stokenKey])}</span></li>`
                  }
                } else {
                  htmlTemplate += `<li><span style="font-size: 1.1rem; font-weight: 600">${escapeHTML(key)}</span>: <span style="user-select: all; word-break: break-all;">${escapeHTML(response.data.data[key])}</span></li>`
                }
              }

              htmlTemplate += `</ul>`
              getElement("card-bduss-success-inject").innerHTML = htmlTemplate
            }
            sign = ''
            switchActiveStatus("card-bduss-success")
          }
          closeAuthPage()
        } else {
          sign = ''
          switchActiveStatus("card-bduss-error")
        }
      }).catch(e => {
        if (!controller.bduss[controller.bduss.length - 2].signal.aborted) {
          sign = ''
          switchActiveStatus("card-bduss-error")
        }
      })
    }
    //hash check
    const hashCheck = (hash) => {
      if (!hash || (hash && hash.length < 3)) {
        return
      }
      try {
        callbackURL = new URL(atob(decodeURIComponent(hash.slice(2)).replaceAll('_', '/').replaceAll('-', '+')))
        if (window.location.host + window.location.pathname === callbackURL.host + callbackURL.pathname) {
          throw Error('Loop!')
        }
        callbackStoken = callbackURL.searchParams.get('stoken_type')
        // try hash
        if (callbackURL.hash) {
          const hashParams = [...new URLSearchParams(callbackURL.hash.slice(2)).entries()]
          for (const hashParam of hashParams) {
            if (!callbackStoken && hashParam[0] === 'stoken_type') {
              callbackStoken = hashParam[1]
              hashCallback = true
            }
            if (!callbackURL.searchParams.has(hashParam[0])) {
              callbackURL.searchParams.set(hashParam[0], hashParam[1])
            }
          }
        }
        if (callbackStoken) {
          fullMode()
        }
        getElement("app-alert-link").innerText = callbackURL.host
        getElement("app-alert-link").href = hashCallback ? callbackURL.href.replace(callbackURL.search, '') : callbackURL.href.replace(callbackURL.hash, '')
        getElement("app-alert").classList.remove("none")
        getElement("app-alert").classList.add("callback-link")
        getElement("app-alert").classList.add("flex")

      } catch (error) {
        console.error(error)
      }
    }

    const eta = (endTime, loaction) => {
      let now = new Date
      if (now < endTime) {
        document.querySelector("#card-bduss-success-eta h1").innerText = Math.ceil((endTime - now) / 1000)
        setTimeout(() => eta(endTime, loaction), 200);
      } else {
        window.open(loaction, '_self')
      }
    }

    const fullMode = () => {
      fullModeStatus = !fullModeStatus
      if (!fullModeStatus) {
        document.getElementById("more-button").classList.remove("primary")
      } else {
        document.getElementById("more-button").classList.add("primary")
      }
    }

    //https://stackoverflow.com/questions/30661497/xss-prevention-and-innerhtml
    const escapeHTML = unsafe_str => {
      return unsafe_str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/\'/g, '&#39;')
        .replace(/\//g, '&#x2F;')
    }

    const switchMode = () => {
      fullMode()
      // getStatus(1, sign)
      init(true)
    }

    const firstCallbackCheck = () => {
      localStorage.setItem('callback-checked', '1')
      switchActiveStatus("card-bduss-success")
      init(true)
    }

    hashCheck(location.hash)

    // first user?
    let isFirstUser = localStorage.getItem('callback-checked') !== '1'
    if (callbackURL?.host && isFirstUser) {
      switchActiveStatus("card-callback-check")
    } else {
      init(true)
    }
  </script>
</body>
